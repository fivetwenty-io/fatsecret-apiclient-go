version: "1"

# ─── Reusable Types ──────────────────────────────────────────────────────────
types:
  FoodsSearchResult:
    kind: object
    fields:
      max_results:
        type: APIInt
        required: true
        description: "Results returned in this page"
      total_results:
        type: APIInt
        required: true
        description: "Total matching results across all pages"
      page_number:
        type: APIInt
        required: true
        description: "Zero-based page index"
      food:
        type: FlexSlice[Food]
        required: false
        description: "Matched food items; absent when total_results=0"
        # foods.search v3/v5 nest the list under results.food, collapse to a single
        # object when one food matches, and omit results when total_results=0.
        nested:
          outer: results
          inner: food

  Food:
    kind: object
    fields:
      food_id:
        type: APIInt
        required: true
        description: "Unique food identifier"
      food_name:
        type: string
        required: true
        description: "Display name of the food"
      food_type:
        type: string
        required: true
        description: "Generic or Brand"
      brand_name:
        type: string
        required: false
        description: "Brand name; present only for Brand food_type"
      food_url:
        type: string
        required: true
        description: "FatSecret URL for the food"
      servings:
        type: FlexSlice[Serving]
        required: true
        description: "Available serving sizes"
        # FatSecret returns servings as {"serving": [...]}, collapsing to a single
        # object when one serving exists and an empty string/absent when none do.
        nested:
          outer: servings
          inner: serving
      food_images:
        type: string
        required: false
        description: "Food image URLs; Premier tier + include_food_images=true only"
      food_attributes:
        type: string
        required: false
        description: "Allergen / preference attributes; Premier tier only"
      food_sub_categories:
        type: string
        required: false
        description: "Sub-category strings; Premier tier + include_sub_categories=true only"

  Serving:
    kind: object
    fields:
      serving_id:
        type: APIInt
        required: true
        description: "Unique serving identifier"
      serving_description:
        type: string
        required: true
        description: "Human-readable serving description (e.g. '1 cup')"
      serving_url:
        type: string
        required: true
        description: "FatSecret URL for the serving"
      metric_serving_amount:
        type: APIFloat
        required: false
        description: "Amount in metric units; absent if no metric equivalent"
      metric_serving_unit:
        type: string
        required: false
        description: "Metric unit (g, ml, etc.)"
      number_of_units:
        type: APIFloat
        required: true
        description: "Number of serving units"
      measurement_description:
        type: string
        required: true
        description: "Unit description matching number_of_units"
      is_default:
        type: APIBool
        required: false
        description: "Whether this is the default serving; Premier tier only"
      calories:
        type: APIFloat
        required: true
        description: "Energy in kcal"
      carbohydrate:
        type: APIFloat
        required: true
        description: "Total carbohydrate in grams"
      protein:
        type: APIFloat
        required: true
        description: "Protein in grams"
      fat:
        type: APIFloat
        required: true
        description: "Total fat in grams"
      saturated_fat:
        type: APIFloat
        required: false
        description: "Saturated fat in grams"
      polyunsaturated_fat:
        type: APIFloat
        required: false
        description: "Polyunsaturated fat in grams"
      monounsaturated_fat:
        type: APIFloat
        required: false
        description: "Monounsaturated fat in grams"
      trans_fat:
        type: APIFloat
        required: false
        description: "Trans fat in grams"
      cholesterol:
        type: APIFloat
        required: false
        description: "Cholesterol in mg"
      sodium:
        type: APIFloat
        required: false
        description: "Sodium in mg"
      potassium:
        type: APIFloat
        required: false
        description: "Potassium in mg"
      fiber:
        type: APIFloat
        required: false
        description: "Dietary fiber in grams"
      sugar:
        type: APIFloat
        required: false
        description: "Total sugars in grams"
      added_sugars:
        type: APIFloat
        required: false
        description: "Added sugars in grams; v4+ only"
      vitamin_d:
        type: APIFloat
        required: false
        description: "Vitamin D in mcg; v4+ only"
      vitamin_a:
        type: APIFloat
        required: false
        description: "Vitamin A in mcg"
      vitamin_c:
        type: APIFloat
        required: false
        description: "Vitamin C in mg"
      calcium:
        type: APIFloat
        required: false
        description: "Calcium in mg"
      iron:
        type: APIFloat
        required: false
        description: "Iron in mg"

  FoodEntry:
    kind: object
    fields:
      food_entry_id:
        type: APIInt
        required: true
        description: "Unique diary entry identifier"
      date_int:
        type: APIDaysEpoch
        required: true
        description: "Days since 1970-01-01"
      food_entry_name:
        type: string
        required: true
        description: "Name of the food as logged"
      serving_id:
        type: APIInt
        required: true
        description: "Serving used for this entry"
      number_of_units:
        type: APIFloat
        required: true
        description: "Number of servings consumed"
      meal:
        type: string
        required: true
        description: "Meal slot: Breakfast, Lunch, Dinner, or Other"
      calories:
        type: APIFloat
        required: true
        description: "Calories for this entry"
      carbohydrate:
        type: APIFloat
        required: false
        description: "Carbohydrate in grams"
      protein:
        type: APIFloat
        required: false
        description: "Protein in grams"
      fat:
        type: APIFloat
        required: false
        description: "Fat in grams"

  FoodEntriesResult:
    kind: object
    fields:
      food_entry:
        type: FlexSlice[FoodEntry]
        required: false
        description: "Diary entries; absent when none recorded"

  FoodMonthResult:
    kind: object
    fields:
      month:
        type: string
        required: true
        description: "Month number string"
      day:
        type: FlexSlice[FoodDayEntry]
        required: false
        description: "Per-day entry aggregates"

  FoodDayEntry:
    kind: object
    fields:
      date_int:
        type: APIDaysEpoch
        required: true
        description: "Days since 1970-01-01"
      calories:
        type: APIFloat
        required: false
        description: "Total calories for the day"
      carbohydrate:
        type: APIFloat
        required: false
        description: "Total carbohydrate in grams"
      protein:
        type: APIFloat
        required: false
        description: "Total protein in grams"
      fat:
        type: APIFloat
        required: false
        description: "Total fat in grams"

  Recipe:
    kind: object
    fields:
      recipe_id:
        type: APIInt
        required: true
        description: "Unique recipe identifier"
      recipe_name:
        type: string
        required: true
        description: "Recipe display name"
      recipe_description:
        type: string
        required: false
        description: "Short description; absent for user-created recipes"
      recipe_url:
        type: string
        required: true
        description: "FatSecret URL for the recipe"
      recipe_image:
        type: string
        required: false
        description: "Primary recipe image URL"
      recipe_nutrition:
        type: RecipeNutrition
        required: true
        description: "Aggregate nutritional info per serving"
      recipe_types:
        type: FlexSlice[string]
        required: false
        description: "Recipe type labels (e.g. Desserts)"
      recipe_categories:
        type: FlexSlice[RecipeCategory]
        required: false
        description: "Recipe category objects"
      recipe_images:
        type: FlexSlice[string]
        required: false
        description: "Additional recipe image URLs"
      serving_sizes:
        type: FlexSlice[RecipeServing]
        required: false
        description: "Per-serving nutritional breakdown"
      ingredients:
        type: FlexSlice[RecipeIngredient]
        required: false
        description: "Ingredient list"
      directions:
        type: FlexSlice[RecipeDirection]
        required: false
        description: "Preparation directions"
      preparation_time_min:
        type: APIInt
        required: false
        description: "Prep time in minutes"
      cooking_time_min:
        type: APIInt
        required: false
        description: "Cook time in minutes"
      number_of_servings:
        type: APIFloat
        required: false
        description: "Number of servings the recipe yields"
      rating:
        type: APIInt
        required: false
        description: "Community rating 0–5"

  RecipeNutrition:
    kind: object
    fields:
      calories:
        type: APIFloat
        required: true
        description: "Calories per serving"
      carbohydrate:
        type: APIFloat
        required: true
        description: "Carbohydrate per serving in grams"
      protein:
        type: APIFloat
        required: true
        description: "Protein per serving in grams"
      fat:
        type: APIFloat
        required: true
        description: "Fat per serving in grams"

  RecipeServing:
    kind: object
    fields:
      serving_size:
        type: string
        required: true
        description: "Human-readable serving size"
      calories:
        type: APIFloat
        required: true
        description: "Calories for this serving"
      carbohydrate:
        type: APIFloat
        required: true
        description: "Carbohydrate in grams"
      protein:
        type: APIFloat
        required: true
        description: "Protein in grams"
      fat:
        type: APIFloat
        required: true
        description: "Fat in grams"

  RecipeIngredient:
    kind: object
    fields:
      food_id:
        type: APIInt
        required: true
        description: "Food identifier for the ingredient"
      food_name:
        type: string
        required: true
        description: "Ingredient name"
      serving_id:
        type: APIInt
        required: false
        description: "Serving used for this ingredient"
      number_of_units:
        type: APIFloat
        required: false
        description: "Quantity of servings"
      measurement_description:
        type: string
        required: false
        description: "Unit description"
      ingredient_description:
        type: string
        required: false
        description: "Full text ingredient description"

  RecipeDirection:
    kind: object
    fields:
      direction_number:
        type: APIInt
        required: true
        description: "Step number (1-based)"
      direction_description:
        type: string
        required: true
        description: "Step instructions"

  RecipeCategory:
    kind: object
    fields:
      recipe_category_name:
        type: string
        required: true
        description: "Category label"
      recipe_category_url:
        type: string
        required: false
        description: "FatSecret URL for the category"

  RecipesSearchResult:
    kind: object
    fields:
      max_results:
        type: APIInt
        required: true
        description: "Results returned in this page"
      total_results:
        type: APIInt
        required: true
        description: "Total matching results"
      page_number:
        type: APIInt
        required: true
        description: "Zero-based page index"
      recipe:
        type: FlexSlice[Recipe]
        required: false
        description: "Matched recipes"

  FoodCategory:
    kind: object
    fields:
      food_category_id:
        type: APIInt
        required: true
        description: "Unique category identifier"
      food_category_name:
        type: string
        required: true
        description: "Category display name"
      food_category_description:
        type: string
        required: false
        description: "Category description"

  FoodBrand:
    kind: object
    fields:
      brand_id:
        type: APIInt
        required: true
        description: "Unique brand identifier"
      brand_name:
        type: string
        required: true
        description: "Brand display name"
      brand_type:
        type: string
        required: false
        description: "manufacturer, restaurant, or supermarket"

  Exercise:
    kind: object
    fields:
      exercise_id:
        type: APIInt
        required: true
        description: "Unique exercise type identifier"
      exercise_name:
        type: string
        required: true
        description: "Exercise display name"

  ExerciseEntry:
    kind: object
    fields:
      shift_to_id:
        type: APIInt
        required: true
        description: "Exercise type identifier (0 for custom)"
      shift_to_name:
        type: string
        required: true
        description: "Exercise type name"
      kcal:
        type: APIFloat
        required: true
        description: "Calories burned"
      minutes:
        type: APIFloat
        required: true
        description: "Duration in minutes"

  ExerciseEntriesResult:
    kind: object
    fields:
      exercise_entry:
        type: FlexSlice[ExerciseEntry]
        required: false
        description: "Logged exercise entries"

  WeightEntry:
    kind: object
    fields:
      date_int:
        type: APIDaysEpoch
        required: true
        description: "Days since 1970-01-01"
      weight_kg:
        type: APIFloat
        required: true
        description: "Weight in kilograms"
      weight_comment:
        type: string
        required: false
        description: "Optional free-text comment"

  WeightMonthResult:
    kind: object
    fields:
      month:
        type: string
        required: true
        description: "Month number string"
      day:
        type: FlexSlice[WeightEntry]
        required: false
        description: "Per-day weight entries"

  ProfileAuth:
    kind: object
    fields:
      auth_token:
        type: string
        required: true
        description: "OAuth1 token for the user"
      auth_secret:
        type: string
        required: true
        description: "OAuth1 token secret for the user"
      profile_id:
        type: string
        required: false
        description: "Platform-assigned profile identifier"

  Profile:
    kind: object
    fields:
      user_id:
        type: string
        required: false
        description: "Application-assigned user identifier"
      auth_token:
        type: string
        required: true
        description: "OAuth1 token"
      auth_secret:
        type: string
        required: true
        description: "OAuth1 token secret"
      current_weight_kg:
        type: APIFloat
        required: false
        description: "Current weight in kilograms"
      goal_weight_kg:
        type: APIFloat
        required: false
        description: "Goal weight in kilograms"
      current_height_cm:
        type: APIFloat
        required: false
        description: "Height in centimetres"
      birthday_date:
        type: APIDaysEpoch
        required: false
        description: "Birthday as days-since-epoch"
      gender:
        type: string
        required: false
        description: "m or f"

  SavedMeal:
    kind: object
    fields:
      saved_meal_id:
        type: APIInt
        required: true
        description: "Unique saved meal identifier"
      saved_meal_name:
        type: string
        required: true
        description: "Meal display name"
      saved_meal_description:
        type: string
        required: false
        description: "Optional description"
      meals:
        type: string
        required: false
        description: "Meal slot association: Breakfast, Lunch, Dinner, or Other"

  SavedMealItem:
    kind: object
    fields:
      saved_meal_item_id:
        type: APIInt
        required: true
        description: "Unique saved meal item identifier"
      food_id:
        type: APIInt
        required: true
        description: "Food identifier"
      food_entry_name:
        type: string
        required: true
        description: "Food name as saved"
      serving_id:
        type: APIInt
        required: true
        description: "Serving identifier"
      number_of_units:
        type: APIFloat
        required: true
        description: "Number of servings"
      meal:
        type: string
        required: true
        description: "Meal slot"

  NLPFoodResponse:
    kind: object
    fields:
      food_id:
        type: APIInt
        required: true
        description: "Matched food identifier"
      food_entry_name:
        type: string
        required: true
        description: "Recognized food name"
      servings:
        type: FlexSlice[Serving]
        required: false
        description: "Serving suggestions"

  FeedbackResponse:
    kind: object
    fields:
      tracking_id:
        type: string
        required: true
        description: "Submission tracking identifier"
      upload_url_front:
        type: string
        required: false
        description: "Pre-signed URL to upload front-of-pack image"
      upload_url_back:
        type: string
        required: false
        description: "Pre-signed URL to upload back-of-pack image"
      upload_url_nutrition:
        type: string
        required: false
        description: "Pre-signed URL to upload nutrition panel image"
      upload_url_ingredients:
        type: string
        required: false
        description: "Pre-signed URL to upload ingredients image"

  SuccessResult:
    kind: object
    fields:
      success:
        type: APIInt
        required: true
        description: "1 on success"

  SavedMealCreateResult:
    kind: object
    fields:
      saved_meal_id:
        type: APIInt
        required: true
        description: "Identifier of the newly created saved meal"

  SavedMealItemCreateResult:
    kind: object
    fields:
      saved_meal_item_id:
        type: APIInt
        required: true
        description: "Identifier of the newly created saved meal item"

  FoodCreateResult:
    kind: object
    fields:
      food_id:
        type: APIInt
        required: true
        description: "Identifier of the newly created food"

  FoodCategoriesResult:
    kind: object
    fields:
      food_category:
        type: FlexSlice[FoodCategory]
        required: false
        description: "Food category list"

  FoodSubCategoriesResult:
    kind: object
    fields:
      food_sub_category:
        type: FlexSlice[string]
        required: false
        description: "Food sub-category name list"

  FoodBrandsResult:
    kind: object
    fields:
      brand:
        type: FlexSlice[FoodBrand]
        required: false
        description: "Brand list"

  ExercisesResult:
    kind: object
    fields:
      exercise:
        type: FlexSlice[Exercise]
        required: false
        description: "Exercise type list"

  RecipeTypesResult:
    kind: object
    fields:
      recipe_type:
        type: FlexSlice[string]
        required: false
        description: "Recipe type name list"

  FoodsResult:
    kind: object
    fields:
      food:
        type: FlexSlice[Food]
        required: false
        description: "Food list"

  RecipesResult:
    kind: object
    fields:
      recipe:
        type: FlexSlice[Recipe]
        required: false
        description: "Recipe list"

  SavedMealsResult:
    kind: object
    fields:
      saved_meal:
        type: FlexSlice[SavedMeal]
        required: false
        description: "Saved meal list"

  SavedMealItemsResult:
    kind: object
    fields:
      saved_meal_item:
        type: FlexSlice[SavedMealItem]
        required: false
        description: "Saved meal item list"

  AutocompleteResult:
    kind: object
    fields:
      suggestion:
        type: FlexSlice[string]
        required: false
        description: "Autocomplete suggestion strings"

# ─── Methods ─────────────────────────────────────────────────────────────────
methods:

  # ── foods namespace ──────────────────────────────────────────────────────

  - namespace: foods
    name: search
    version: 1
    all_versions: [1, 3, 5]
    deprecated_versions: [1]
    http_verb: GET
    rest_path: "/rest/foods/v1"
    auth_tier: client_credentials
    scope: basic
    pagination: true
    params:
      - name: search_expression
        type: string
        required: false
        location: query
      - name: page_number
        type: APIInt
        required: false
        location: query
      - name: max_results
        type: APIInt
        required: false
        location: query
        constraint: "max=50"
      - name: region
        type: string
        required: false
        location: query
      - name: language
        type: string
        required: false
        location: query
    response_root: "foods"
    response_type: FoodsSearchResult
    smoke_fixture: '{"foods":{"food":[{"food_id":"1641","food_name":"Chicken Breast","food_type":"Generic","food_url":"https://www.fatsecret.com/calories-nutrition/generic/chicken-breast"}],"max_results":"1","total_results":"1","page_number":"0"}}'

  - namespace: foods
    name: search
    version: 3
    all_versions: [1, 3, 5]
    deprecated_versions: [1]
    http_verb: GET
    rest_path: "/rest/foods/search/v3"
    auth_tier: client_credentials
    scope: premier
    pagination: true
    params:
      - name: search_expression
        type: string
        required: false
        location: query
      - name: page_number
        type: APIInt
        required: false
        location: query
      - name: max_results
        type: APIInt
        required: false
        location: query
        constraint: "max=50"
      - name: food_type
        type: string
        required: false
        location: query
        constraint: "enum=generic,brand"
      - name: include_sub_categories
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: include_food_images
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: include_food_attributes
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: flag_default_serving
        type: APIBool
        required: false
        location: query
      - name: region
        type: string
        required: false
        location: query
      - name: language
        type: string
        required: false
        location: query
    response_root: "foods_search"
    response_type: FoodsSearchResult
    smoke_fixture: '{"foods_search":{"max_results":"1","total_results":"1","page_number":"0","results":{"food":[{"food_id":"1641","food_name":"Chicken Breast","food_type":"Generic","food_url":"https://www.fatsecret.com/calories-nutrition/generic/chicken-breast"}]}}}'

  - namespace: foods
    name: search
    version: 5
    all_versions: [1, 3, 5]
    deprecated_versions: [1]
    http_verb: GET
    rest_path: "/rest/foods/search/v5"
    auth_tier: client_credentials
    scope: basic
    pagination: true
    params:
      - name: search_expression
        type: string
        required: false
        location: query
      - name: page_number
        type: APIInt
        required: false
        location: query
      - name: max_results
        type: APIInt
        required: false
        location: query
        constraint: "max=50"
      - name: food_type
        type: string
        required: false
        location: query
        constraint: "enum=generic,brand"
      - name: include_sub_categories
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: include_food_images
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: include_food_attributes
        type: APIBool
        required: false
        location: query
        tier_gate: premier
      - name: flag_default_serving
        type: APIBool
        required: false
        location: query
      - name: region
        type: string
        required: false
        location: query
      - name: language
        type: string
        required: false
        location: query
    response_root: "foods_search"
    response_type: FoodsSearchResult
    smoke_fixture: '{"foods_search":{"max_results":"1","total_results":"1","page_number":"0","results":{"food":[{"food_id":"1641","food_name":"Chicken Breast","food_type":"Generic","food_url":"https://www.fatsecret.com/calories-nutrition/generic/chicken-breast"}]}}}'

  - namespace: foods
    name: autocomplete
    version: 2
    all_versions: [2]
    deprecated_versions: []
    http_verb: GET
    rest_path: "/rest/foods/autocomplete/v2"
    auth_tier: client_credentials
    scope: premier
    pagination: false
    params:
      - name: expression
        type: string
        required: true
        location: query
      - name: max_results
        type: APIInt
        required: false
        location: query
        constraint: "max=10"
      - name: region
        type: string
        required: false
        location: query
      - name: language
        type: string
        required: false
        location: query
    response_root: "suggestions"
    response_type: AutocompleteResult

  # ── foods_favorites namespace (maps to foods package) ────────────────────

  - namespace: foods_favorites
    name: get_favorites
    version: 2
    all_versions: [2]
    deprecated_versions: []
    http_verb: GET
    rest_path: "/rest/foods/favorites/v2"
    auth_tier: oauth1_delegated
    scope: ""
    pagination: false
    params: []
    response_root: "foods"
    response_type: FoodsResult
    smoke_fixture: '{"foods":{"food":[{"food_id":"1641","food_name":"Chicken Breast","food_type":"Generic","food_url":"https://www.fatsecret.com/calories-nutrition/generic/chicken-breast"}]}}'

  - namespace: foods_favorites
    name: get_most_eaten
    version: 2
    all_versions: [2]
    deprecated_versions: []
    http_verb: GET
    rest_path: "/rest/foods/most-eaten/v2"
    auth_tier: oauth1_delegated
    scope: ""
