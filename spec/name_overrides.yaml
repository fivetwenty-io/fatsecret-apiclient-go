version: "1"

# Name overrides per P2 §3.3–§3.4.
# Builder applies these after the naming algorithm; override wins.
# Format: namespace + name + version uniquely identify a method entry.

overrides:
  # foods namespace — "List" preferred over "Get" for collection returns (P2 §3.4)
  - namespace: foods_favorites
    name: get_favorites
    version: 2
    go_name: GetFavorites

  - namespace: foods_favorites
    name: get_most_eaten
    version: 2
    go_name: GetMostEaten

  - namespace: foods_favorites
    name: get_recently_eaten
    version: 2
    go_name: GetRecentlyEaten

  # foods.search version disambiguation
  - namespace: foods
    name: search
    version: 1
    go_name: SearchV1   # deprecated; suffix forces distinction from canonical

  - namespace: foods
    name: search
    version: 3
    go_name: Search     # canonical; no suffix

  - namespace: foods
    name: search
    version: 5
    go_name: SearchV5

  # food.get version disambiguation
  - namespace: food
    name: get
    version: 4
    go_name: Get        # canonical; no suffix

  - namespace: food
    name: get
    version: 5
    go_name: GetV5

  # food_categories / food_sub_categories / food_brands — "GetAll" preferred
  - namespace: food_categories
    name: get_all
    version: 2
    go_name: GetAll

  - namespace: food_sub_categories
    name: get_all
    version: 2
    go_name: GetAll

  - namespace: food_brands
    name: get_all
    version: 2
    go_name: GetAll

  # food_entries — explicit names matching P2 §3.4
  - namespace: food_entries
    name: get
    version: 2
    go_name: Get

  - namespace: food_entries
    name: get_month
    version: 2
    go_name: GetMonth

  - namespace: food_entries
    name: copy
    version: 1
    go_name: Copy

  - namespace: food_entries
    name: create
    version: 1
    go_name: Create

  - namespace: food_entries
    name: edit
    version: 1
    go_name: Edit

  - namespace: food_entries
    name: delete
    version: 1
    go_name: Delete

  # recipes namespace
  - namespace: recipes
    name: search
    version: 3
    go_name: Search

  - namespace: recipes_favorites
    name: get_favorites
    version: 2
